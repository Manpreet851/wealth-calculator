<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta property="og:description" content="Model decades of disciplined investing — lumpsum, SIPs with step-ups, compounding periods, and SWP withdrawal phases." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23064E3B'/><polyline points='20,65 40,40 60,52 80,25' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --emerald:#064E3B;--emerald-hover:#047857;--emerald-light:#D1FAE5;--emerald-mid:#10B981;
    --charcoal:#111827;--secondary:#4B5563;--tertiary:#9CA3AF;--border:#E5E7EB;--border-strong:#D1D5DB;
    --bg:#FFFFFF;--bg-secondary:#F9FAFB;--bg-tertiary:#F3F4F6;
    --font-serif:'Cormorant Garamond',Georgia,serif;
    --font-sans:'Work Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  html,body,#root{height:100%;margin:0}
  body{font-family:var(--font-sans);background:#F8F7F4;color:var(--charcoal);-webkit-font-smoothing:antialiased}
  .app-wrap{min-height:100vh;display:flex;flex-direction:column}

  /* HEADER */
  .site-header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-icon{width:34px;height:34px;border:1.5px solid var(--emerald);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-icon svg{width:16px;height:16px;stroke:var(--emerald);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand-text{display:flex;flex-direction:column;gap:1px}
  .brand-wordmark{font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--charcoal)}
  .brand-tagline{font-family:var(--font-serif);font-size:12px;color:var(--secondary);font-style:italic;line-height:1.3;max-width:420px}
  .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

  /* CURRENCY TOGGLE */
  .currency-group{display:flex;border:1px solid var(--border-strong);overflow:hidden}
  .currency-btn{font-family:var(--font-mono);font-size:11px;padding:5px 10px;background:var(--bg);border:none;cursor:pointer;color:var(--secondary);transition:all .15s;font-weight:500}
  .currency-btn.active{background:var(--charcoal);color:#fff}
  .currency-btn:hover:not(.active){background:var(--bg-secondary)}

  /* MAIN LAYOUT */
  .main-layout{display:grid;grid-template-columns:340px 1fr;flex:1;align-items:start}
  .params-panel{background:var(--bg);border-right:1px solid var(--border);padding:1.5rem;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
  .proj-panel{padding:2rem;min-width:0}

  /* PARAMS */
  .panel-title{font-family:var(--font-serif);font-size:20px;font-weight:600;color:var(--charcoal);margin-bottom:1.25rem;letter-spacing:.01em}
  .param-group{margin-bottom:1rem}
  .param-group-title{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--tertiary);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
  .param-row{margin-bottom:.875rem}
  .param-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px}
  .param-label span:first-child{font-size:12px;color:var(--secondary);font-weight:500;white-space:nowrap}
  .param-value{font-family:var(--font-mono);font-size:12px;color:var(--charcoal);font-weight:500;background:var(--bg-secondary);border:1px solid var(--border);padding:2px 6px;min-width:80px;max-width:90px;text-align:right;outline:none}
  .param-value:focus{outline:2px solid var(--emerald);outline-offset:-1px;border-color:var(--emerald)}
  .slider-wrap{position:relative;height:20px;display:flex;align-items:center}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--border-strong);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--emerald);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--emerald);cursor:pointer;transition:transform .1s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--emerald);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--emerald);cursor:pointer}
  input[type=range]:focus{outline:none}
  input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(6,78,59,.25)}
  .withdrawal-section{background:var(--bg-secondary);border:1px solid var(--border);padding:1rem;margin-top:.5rem}
  .withdrawal-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--emerald);margin-bottom:.875rem}

  /* METRIC CARDS */
  .metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .metric-card{background:var(--bg);border:1px solid var(--border);padding:16px;position:relative;transition:border-color .2s}
  .metric-card:hover{border-color:var(--border-strong)}
  .metric-card.accent{border:1.5px solid var(--emerald)}
  .metric-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tertiary);margin-bottom:8px;line-height:1.4}
  .metric-value{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--charcoal);line-height:1.2;word-break:break-all}
  .metric-card.accent .metric-value{color:var(--emerald)}
  .metric-sub{font-family:var(--font-mono);font-size:10px;color:var(--tertiary);margin-top:4px}
  .support-strip{display:flex;gap:24px;flex-wrap:wrap;padding:12px 16px;background:var(--bg-tertiary);border:1px solid var(--border);margin-bottom:24px}
  .support-item{display:flex;flex-direction:column;gap:3px}
  .support-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);font-weight:500}
  .support-value{font-family:var(--font-mono);font-size:13px;color:var(--charcoal);font-weight:500}

  /* CHARTS */
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  .chart-card{background:var(--bg);border:1px solid var(--border);padding:16px}
  .chart-title{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--charcoal);margin-bottom:3px}
  .chart-sub{font-size:11px;color:var(--tertiary);margin-bottom:14px}
  .chart-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--secondary)}
  .legend-dot{width:8px;height:8px;border-radius:0;flex-shrink:0}

  /* TABLE */
  .table-card{background:var(--bg);border:1px solid var(--border)}
  .table-header-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
  .table-title{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--charcoal)}
  .table-wrap{overflow:auto;max-height:420px}
  table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px}
  thead{position:sticky;top:0;background:var(--bg-secondary);z-index:1}
  th{padding:8px 12px;text-align:right;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:7px 12px;text-align:right;color:var(--secondary);border-bottom:1px solid var(--bg-secondary)}
  td:first-child{text-align:left;color:var(--charcoal);font-weight:500}
  tr:hover td{background:var(--bg-secondary)}
  tr.phase-1 td:first-child{border-left:2px solid var(--tertiary)}
  tr.phase-2 td:first-child{border-left:2px solid #93C5FD}
  tr.phase-3 td:first-child{border-left:2px solid var(--emerald-mid)}

  /* BUTTONS */
  .btn{font-family:var(--font-sans);font-size:12px;font-weight:500;padding:8px 14px;border:1px solid var(--border-strong);background:var(--bg);color:var(--charcoal);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
  .btn:hover{background:var(--bg-secondary)}
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--emerald);color:#fff;border-color:var(--emerald)}
  .btn-primary:hover:not(:disabled){background:var(--emerald-hover);border-color:var(--emerald-hover)}
  .btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--charcoal);color:#fff;padding:10px 16px;font-size:12px;font-family:var(--font-sans);z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:320px}
  .toast.show{opacity:1;transform:translateY(0)}

  /* FOOTER */
  .site-footer{background:var(--bg);border-top:1px solid var(--border);padding:16px 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .footer-text{font-size:11px;color:var(--tertiary)}
  .footer-disclaimer{font-size:10px;color:var(--tertiary);font-style:italic;max-width:600px;text-align:right}

  /* PHASE LEGEND */
  .phase-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .phase-pip{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tertiary)}
  .phase-pip-dot{width:8px;height:8px;flex-shrink:0}

  /* RECHARTS overrides */
  .recharts-cartesian-axis-tick-value{font-family:'IBM Plex Mono',monospace!important;font-size:9px!important}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-strong)}

  /* RESPONSIVE */
  @media(max-width:900px){
    .main-layout{grid-template-columns:1fr}
    .params-panel{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
    .metrics-grid{grid-template-columns:repeat(2,1fr)}
    .charts-row{grid-template-columns:1fr}
    .brand-tagline{display:none}
    .header-right{gap:4px}
    .site-header{padding:0 1rem}
    .proj-panel{padding:1rem}
  }
  @media(max-width:540px){
    .metrics-grid{grid-template-columns:1fr 1fr}
    .currency-btn{padding:5px 7px;font-size:10px}
    .btn{font-size:11px;padding:7px 10px}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var _React = React;
  var _ReactDOM = ReactDOM;
  var _Recharts = Recharts;

  const {useState,useEffect,useRef,useCallback,useMemo}=_React;
  const {LineChart,Line,AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer}=_Recharts;

  const CURRENCIES={
    INR:{sym:'₹',code:'INR',locale:'en-IN'},
    USD:{sym:'$',code:'USD',locale:'en-US'},
    EUR:{sym:'€',code:'EUR',locale:'de-DE'}
  };

  const DEFAULTS={
    lumpsum:500000,sip:25000,stepUp:10,annualReturn:12,duration:30,
    sipStopYear:20,withdrawalStartYear:25,withdrawalReturn:8,
    swp:0,swpStepUp:5,currency:'INR'
  };

  function parseParams(){
    try{
      const p=new URLSearchParams(window.location.search);
      if(!p.has('ls'))return null;
      return{
        lumpsum:+p.get('ls')||DEFAULTS.lumpsum,
        sip:+p.get('sp')||DEFAULTS.sip,
        stepUp:+p.get('su')||DEFAULTS.stepUp,
        annualReturn:+p.get('ar')||DEFAULTS.annualReturn,
        duration:+p.get('dur')||DEFAULTS.duration,
        sipStopYear:+p.get('ssy')||DEFAULTS.sipStopYear,
        withdrawalStartYear:+p.get('wsy')||DEFAULTS.withdrawalStartYear,
        withdrawalReturn:+p.get('wr')||DEFAULTS.withdrawalReturn,
        swp:+p.get('swp')||DEFAULTS.swp,
        swpStepUp:+p.get('stu')||DEFAULTS.swpStepUp,
        currency:p.get('cur')||DEFAULTS.currency
      };
    }catch(e){return null}
  }

  function fmtNum(val,cur){
    const c=CURRENCIES[cur]||CURRENCIES.INR;
    if(cur==='INR'){
      if(val>=10000000)return c.sym+(val/10000000).toFixed(2)+' Cr';
      if(val>=100000)return c.sym+(val/100000).toFixed(2)+' L';
      if(val>=1000)return c.sym+(val/1000).toFixed(1)+'K';
      return c.sym+Math.round(val).toLocaleString();
    }
    if(val>=1000000000)return c.sym+(val/1000000000).toFixed(2)+'B';
    if(val>=1000000)return c.sym+(val/1000000).toFixed(2)+'M';
    if(val>=1000)return c.sym+(val/1000).toFixed(1)+'K';
    return c.sym+Math.round(val).toLocaleString();
  }

  function fmtFull(val,cur){
    const c=CURRENCIES[cur]||CURRENCIES.INR;
    return c.sym+Math.round(val).toLocaleString(c.locale);
  }

  function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3500);
  }

  function calcProjection(p){
    const{lumpsum,sip,stepUp,annualReturn,duration,sipStopYear,withdrawalStartYear,withdrawalReturn,swp,swpStepUp}=p;
    const mRate=(Math.pow(1+annualReturn/100,1/12)-1);
    const mRateW=(Math.pow(1+withdrawalReturn/100,1/12)-1);
    let corpus=lumpsum;
    let totalInvested=lumpsum;
    let totalWithdrawn=0;
    let corpusAtSipStop=0;
    const rows=[];
    let curSip=sip;
    let curSwp=swp;

    for(let yr=1;yr<=duration;yr++){
      let sipThisYear=0;
      let withdrawnThisYear=0;
      const isAccum=yr<=sipStopYear;
      const isWithdrawal=yr>=withdrawalStartYear;
      if(yr>1&&isAccum){curSip=curSip*(1+stepUp/100)}
      if(yr>withdrawalStartYear&&isWithdrawal&&swp>0){curSwp=curSwp*(1+swpStepUp/100)}
      const rate=isWithdrawal?mRateW:mRate;
      for(let m=1;m<=12;m++){
        if(isAccum){corpus+=curSip;sipThisYear+=curSip;totalInvested+=curSip}
        corpus*=(1+rate);
        if(isWithdrawal&&swp>0){const w=Math.min(curSwp,corpus);corpus-=w;withdrawnThisYear+=w;totalWithdrawn+=w}
      }
      if(yr===sipStopYear)corpusAtSipStop=corpus;
      const returns=corpus-(totalInvested-totalWithdrawn);
      rows.push({
        year:yr,sip:sipThisYear,totalInvested,
        withdrawn:withdrawnThisYear,
        returns:Math.max(0,returns),
        corpus:Math.max(0,corpus)
      });
      corpus=Math.max(0,corpus);
    }
    const finalCorpus=rows.length>0?rows[rows.length-1].corpus:0;
    const totalReturns=finalCorpus+totalWithdrawn-totalInvested;
    const multiplier=totalInvested>0?(finalCorpus+totalWithdrawn)/totalInvested:0;
    if(sipStopYear>=duration&&rows.length>0)corpusAtSipStop=rows[rows.length-1].corpus;
    return{rows,totalInvested,corpusAtSipStop,totalWithdrawn,finalCorpus,totalReturns,multiplier};
  }

  function SliderInput({label,value,min,max,step,onChange,format,testId}){
    const [editing,setEditing]=useState(false);
    const [draft,setDraft]=useState('');
    const fmtVal=format?format(value):(typeof value==='number'?value.toLocaleString():String(value));

    function handleBlur(){
      setEditing(false);
      const raw=parseFloat(draft.replace(/[^0-9.]/g,''));
      if(!isNaN(raw)){
        const clamped=Math.max(min,Math.min(max,raw));
        onChange(step<1?parseFloat(clamped.toFixed(1)):Math.round(clamped));
      }
    }

    return _React.createElement('div',{className:'param-row'},
      _React.createElement('div',{className:'param-label'},
        _React.createElement('span',null,label),
        _React.createElement('input',{
          className:'param-value',
          type:'text',
          'data-testid':testId+'-input',
          value:editing?draft:fmtVal,
          onFocus:()=>{setEditing(true);setDraft(String(value))},
          onChange:e=>setDraft(e.target.value),
          onBlur:handleBlur,
          onKeyDown:e=>{if(e.key==='Enter')e.target.blur()}
        })
      ),
      _React.createElement('div',{className:'slider-wrap'},
        _React.createElement('input',{
          type:'range',min:min,max:max,step:step||1,value:value,
          'data-testid':testId+'-slider',
          onChange:e=>onChange(+e.target.value)
        })
      )
    );
  }

  function MetricCard({label,value,sub,accent,testId}){
    return _React.createElement('div',{className:'metric-card'+(accent?' accent':''),'data-testid':testId},
      _React.createElement('div',{className:'metric-label'},label),
      _React.createElement('div',{className:'metric-value','data-testid':testId+'-value'},value),
      sub&&_React.createElement('div',{className:'metric-sub'},sub)
    );
  }

  function App(){
    const urlParams=useMemo(()=>parseParams(),[]);
    const init=urlParams||DEFAULTS;

    const [lumpsum,setLumpsum]=useState(init.lumpsum);
    const [sip,setSip]=useState(init.sip);
    const [stepUp,setStepUp]=useState(init.stepUp);
    const [annualReturn,setAnnualReturn]=useState(init.annualReturn);
    const [duration,setDuration]=useState(init.duration);
    const [sipStopYear,setSipStopYear]=useState(init.sipStopYear);
    const [withdrawalStartYear,setWithdrawalStartYear]=useState(init.withdrawalStartYear);
    const [withdrawalReturn,setWithdrawalReturn]=useState(init.withdrawalReturn);
    const [swp,setSwp]=useState(init.swp);
    const [swpStepUp,setSwpStepUp]=useState(init.swpStepUp);
    const [currency,setCurrency]=useState(init.currency);
    const [downloading,setDownloading]=useState(false);

    useEffect(()=>{
      if(urlParams)showToast('✓ Shared scenario loaded successfully');
    },[]);

    useEffect(()=>{
      const params=new URLSearchParams({
        ls:lumpsum,sp:sip,su:stepUp,ar:annualReturn,dur:duration,
        ssy:sipStopYear,wsy:withdrawalStartYear,wr:withdrawalReturn,
        swp:swp,stu:swpStepUp,cur:currency
      });
      if(window.history&&window.history.replaceState){
        window.history.replaceState(null,'','?'+params.toString());
      }
    },[lumpsum,sip,stepUp,annualReturn,duration,sipStopYear,withdrawalStartYear,withdrawalReturn,swp,swpStepUp,currency]);

    const proj=useMemo(()=>calcProjection({
      lumpsum,sip,stepUp,annualReturn,duration,sipStopYear,
      withdrawalStartYear,withdrawalReturn,swp,swpStepUp
    }),[lumpsum,sip,stepUp,annualReturn,duration,sipStopYear,withdrawalStartYear,withdrawalReturn,swp,swpStepUp]);

    const chartData=proj.rows.map(r=>({
      year:r.year,
      corpus:Math.round(r.corpus),
      invested:Math.round(r.totalInvested),
      returns:Math.max(0,Math.round(r.corpus-r.totalInvested+r.withdrawn))
    }));

    const f=v=>fmtNum(v,currency);
    const ff=v=>fmtFull(v,currency);

    function handleShare(){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(window.location.href)
          .then(()=>showToast('✓ Scenario URL copied to clipboard'))
          .catch(()=>{
            prompt('Copy this URL:',window.location.href);
          });
      }else{
        prompt('Copy this URL:',window.location.href);
      }
    }

    async function handleDownload(){
      if(downloading)return;
      setDownloading(true);
      try{
        const{jsPDF}=window.jspdf;
        const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
        const M=15,W=210,CW=W-M*2;

        // Header
        doc.setFont('helvetica','bold');
        doc.setFontSize(18);doc.setTextColor(6,78,59);
        doc.text('Heritage Wealth \u00B7 Private Office',M,18);
        doc.setFont('helvetica','normal');
        doc.setFontSize(10);doc.setTextColor(75,85,99);
        doc.text('Wealth Projection Studio \u2014 Scenario Report',M,25);
        doc.text('Generated: '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}),M,31);

        doc.setFontSize(7);doc.setTextColor(156,163,175);
        doc.text('This projection is illustrative. Heritage Wealth \u00B7 Private Office',M,286);
